name: Visual baselines

# Regenerates tests/visual/__screenshots__ inside the same Playwright image the CI visual job uses,
# then commits the result to the branch the workflow was run on. Run it from the Actions tab after an
# intentional visual change (and once to create the first baselines). Review the diff before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v4
      # The Playwright image has no unzip, which setup-bun needs to unpack Bun.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(visual): update baselines"
            git push
          fi
