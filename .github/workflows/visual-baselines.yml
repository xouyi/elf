name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

# Three shards render their part of the screenshots in the official Playwright image; one job merges them and commits.
jobs:
  render:
    name: Render baselines (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      env:
        HOME: /root
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      # Every shard renders its own tests from scratch, so the merged set is complete and drops screenshots of removed examples.
      - run: rm -rf tests/visual/__screenshots__
      - run: bunx playwright test --update-snapshots=all --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: tests/visual/__screenshots__
          retention-days: 7

  commit:
    name: Commit baselines
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf tests/visual/__screenshots__
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-baselines-*
          path: tests/visual/__screenshots__
          merge-multiple: true
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(visual): update baselines"
            git push
          fi
