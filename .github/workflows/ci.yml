name: CI

# Quality gate: nothing is accepted unless this workflow is green. The Docs workflow only deploys after it succeeds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      # Real Chromium (Playwright) runs the browser tests (axe in both themes, keyboard and focus behavior) in `bun run test`.
      - run: bunx playwright install --with-deps chromium
      # typecheck, lint, unit + browser tests, contrast, registry and llms.txt freshness, docs site build, playground build.
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/.output/public
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Baselines must be rendered in exactly this image; see CONTRIBUTING.md.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v4
      # The Playwright image has no unzip, which setup-bun needs to unpack Bun.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Builds the docs site, serves it under /elfUI/ and screenshots every example in isolation
      # (/__examples/<component>/<example>) in both themes at 1280 and 360 px, comparing against
      # tests/visual/__screenshots__. A missing baseline fails the job: run the "Visual baselines" workflow first.
      - run: bun run docs:build
      - run: bun run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7
