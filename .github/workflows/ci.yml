name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The slow suites run as parallel shards. "Check" and "Visual regression" are small summary jobs that only pass when every
# shard passed: they keep the names branch protection requires.
jobs:
  static:
    name: Static checks and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:fast
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/.output/public
          retention-days: 7

  browser:
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx vitest run --project browser --shard=${{ matrix.shard }}/3

  check:
    name: Check
    if: always()
    needs: [static, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check shard to pass
        run: |
          echo "static=${{ needs.static.result }} browser=${{ needs.browser.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.browser.result }}" = success ]

  visual-shard:
    name: Visual regression (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      env:
        HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - run: bun run test:visual --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual:
    name: Visual regression
    if: always()
    needs: [visual-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every visual shard to pass
        run: |
          echo "visual=${{ needs.visual-shard.result }}"
          [ "${{ needs.visual-shard.result }}" = success ]
