name: CI

# Quality gate: nothing is accepted unless this workflow is green. The Docs workflow only deploys after it succeeds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      # Real Chromium (Playwright) is needed by the browser tests that are being added on top of the docs site.
      - run: bunx playwright install --with-deps chromium
      # typecheck, lint, unit tests, contrast, registry and llms.txt freshness, docs site build, playground build.
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/.output/public
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Baselines must be rendered in exactly this image; see CONTRIBUTING.md.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v4
      # The Playwright image has no unzip, which setup-bun needs to unpack Bun.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Temporary: the screenshot harness is being rebuilt on top of the docs site. Until it lands this job only
      # proves that the docs site builds inside the pinned Playwright image; the comparison step is re-enabled
      # (same job name, so branch protection keeps working) when the new tests exist.
      - run: bun run docs:build
      - run: bun run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7
